<style>
:root {

* { box-sizing: border-box; margin: 0; padding: 0; }
body {

  background: var(--bg); color: var(--text); line-height: 1.6;
}
.header {

  border-bottom: 1px solid var(--border); padding: 28px 40px;
}
.header h1 { font-size: 26px; font-weight: 700; }
.header p { color: var(--dim); font-size: 14px; margin-top: 6px; }
.container { max-width: 1200px; margin: 0 auto; padding: 20px 40px; }

/* ── Sidebar / feature list ── */
.layout { display: flex; gap: 20px; }
.sidebar {
  width: 320px; min-width: 320px; max-height: calc(100vh - 140px);
  overflow-y: auto; position: sticky; top: 20px;
}
.sidebar::-webkit-scrollbar { width: 5px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.search-box {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); border-radius: 8px; padding: 10px 14px; font-size: 13px;
  margin-bottom: 12px;
}
.search-box:focus { outline: none; border-color: var(--accent); }
.feat-item {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 14px; margin-bottom: 6px; cursor: pointer;
  transition: all 0.15s ease;
}
.feat-item:hover { background: var(--surface2); border-color: var(--accent); }
.feat-item.selected { background: var(--accent); background: rgba(108,140,255,0.15); border-color: var(--accent); }
.feat-item .fi-rank { color: var(--dim); font-size: 11px; }
.feat-item .fi-name { font-weight: 600; font-size: 14px; margin: 2px 0; }
.feat-item .fi-stats { font-size: 11px; color: var(--dim); display: flex; gap: 12px; }

/* ── Main content ── */
.main { flex: 1; min-width: 0; }
.feat-header {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 20px 24px; margin-bottom: 16px;
}
.feat-header h2 { font-size: 22px; font-weight: 700; }
.feat-header .stats { color: var(--dim); font-size: 13px; margin-top: 6px; display: flex; gap: 20px; }
.feat-header .stats span { font-weight: 600; color: var(--text); }
.example-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 16px 20px; margin-bottom: 10px;
}
.ex-meta {
  font-size: 11px; color: var(--dim); margin-bottom: 10px;
  display: flex; gap: 16px; align-items: center;
}
.ex-meta .act { color: var(--accent); font-weight: 600; }
.ex-instruction {
  font-size: 12px; color: var(--dim); font-style: italic;
  padding: 6px 0 8px 12px; border-left: 2px solid var(--border); margin-bottom: 8px;
}
.ex-context {
  font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
  font-size: 12.5px; line-height: 1.8; word-wrap: break-word; white-space: pre-wrap;
}
.hl {
  background: rgba(251,191,36,0.45); color: #fff; padding: 1px 5px; border-radius: 3px;
  font-weight: 700; border: 1px solid rgba(251,191,36,0.6);
}
.nl { color: #555; font-size: 10px; }
.act-bar {
  display: inline-block; height: 6px; border-radius: 3px; background: var(--accent);
  vertical-align: middle; margin-left: 6px;
}
.empty { color: var(--dim); text-align: center; padding: 60px 20px; }

@media (max-width: 900px) {
  .layout { flex-direction: column; }
  .sidebar { width: 100%; min-width: 0; max-height: 300px; position: static; }
  .container { padding: 12px 16px; }
}
</style>

let selected = null;

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlightCtx(ctx) {
  // First escape HTML
  let s = escHtml(ctx);
  // Replace <<token>> markers — after escaping they become &lt;&lt;...&gt;&gt;
  s = s.replace(/&lt;&lt;(.*?)&gt;&gt;/g, '<span class="hl">$1</span>');
  // Show newlines
  s = s.replace(/\n/g, '<span class="nl">\\n</span>\n');
  return s;
}

function renderFeatureList(features) {
  const el = document.getElementById('feat-list');
  el.innerHTML = features.map(f => `
    <div class="feat-item${selected === f.idx ? ' selected' : ''}"
         onclick="selectFeature(${f.idx})" data-idx="${f.idx}">
      <div class="fi-rank">#${f.rank}</div>
      <div class="fi-name">Feature ${f.idx}</div>
      <div class="fi-stats">
        <span>freq ${f.freq.toFixed(4)}</span>
        <span>mean ${f.mean_act.toFixed(2)}</span>
        <span>max ${f.max_act.toFixed(2)}</span>
      </div>
    </div>
  `).join('');
}

function selectFeature(idx) {
  selected = idx;
  const f = FEATURES.find(x => x.idx === idx);
  if (!f) return;

  // Update sidebar selection
  document.querySelectorAll('.feat-item').forEach(el => {
    el.classList.toggle('selected', parseInt(el.dataset.idx) === idx);
  });

  // Build examples
  let html = `
    <div class="feat-header">
      <h2>Feature ${f.idx} <span style="color:var(--dim);font-size:16px;font-weight:400;">(rank #${f.rank})</span></h2>
      <div class="stats">
        <div>freq: <span>${f.freq.toFixed(4)}</span></div>
        <div>mean act: <span>${f.mean_act.toFixed(2)}</span></div>
        <div>max act: <span>${f.max_act.toFixed(2)}</span></div>
        <div>examples: <span>${f.examples.length}</span></div>
      </div>
    </div>
  `;

  f.examples.forEach((ex, i) => {
    const barW = f.max_act > 0 ? Math.round(ex.act / f.max_act * 80) : 0;
    let posStr = '';
    if (ex.pos >= 0 && ex.total > 0) {
      const pct = (ex.pos / ex.total * 100).toFixed(0);
      posStr = `pos ${ex.pos}/${ex.total} (${pct}%)`;
    }

    html += `
      <div class="example-card">
        <div class="ex-meta">
          <span>Example ${i+1}</span>
          <span class="act">act=${ex.act.toFixed(4)}</span>
          <span class="act-bar" style="width:${barW}px"></span>
          <span>token: "${escHtml(ex.token)}"</span>
          ${posStr ? `<span>${posStr}</span>` : ''}
        </div>
        ${ex.instruction ? `<div class="ex-instruction">${escHtml(ex.instruction)}</div>` : ''}
        <div class="ex-context">${highlightCtx(ex.ctx)}</div>
      </div>
    `;
  });

  document.getElementById('main-content').innerHTML = html;
}

function filterFeatures() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = FEATURES.filter(f => {
    if (!q) return true;
    if (String(f.idx).includes(q)) return true;
    if (String(f.rank).includes(q)) return true;
    // Search through example tokens and instructions
    return f.examples.some(ex =>
      (ex.token || '').toLowerCase().includes(q) ||
      (ex.instruction || '').toLowerCase().includes(q)
    );
  });
  renderFeatureList(filtered);
}

// Init
renderFeatureList(FEATURES);
if (FEATURES.length > 0) selectFeature(FEATURES[0].idx);
</script>
</body>
</html>
